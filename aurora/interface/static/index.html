<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aurora</title>
<style>
  :root{
    --void: #050b12;
    --deep: #081420;
    --teal: #3fe0c5;
    --violet: #8c7cf5;
    --blue: #4a8fe0;
    --text: #eaf3f6;
    --muted: #6e8296;
    --muted-2: #445164;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
    background: var(--void);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  #stars{
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  .aurora-field{
    position: fixed;
    inset: -10%;
    z-index: 1;
    pointer-events: none;
    filter: blur(60px);
    opacity: 0.55;
  }

  .aurora-field span{
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
  }

  .aurora-field span:nth-child(1){
    width: 60vw; height: 60vw;
    left: -10vw; top: -15vw;
    background: radial-gradient(circle, var(--teal), transparent 65%);
    animation: drift1 34s ease-in-out infinite;
  }
  .aurora-field span:nth-child(2){
    width: 55vw; height: 55vw;
    right: -15vw; top: 0vw;
    background: radial-gradient(circle, var(--violet), transparent 65%);
    animation: drift2 42s ease-in-out infinite;
  }
  .aurora-field span:nth-child(3){
    width: 50vw; height: 50vw;
    left: 20vw; bottom: -20vw;
    background: radial-gradient(circle, var(--blue), transparent 65%);
    animation: drift3 38s ease-in-out infinite;
  }

  @keyframes drift1{
    0%, 100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(6vw, 4vw) scale(1.08); }
  }
  @keyframes drift2{
    0%, 100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-5vw, 6vw) scale(1.05); }
  }
  @keyframes drift3{
    0%, 100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(4vw, -5vw) scale(1.1); }
  }

  .vignette{
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(5,11,18,0.55) 78%, var(--void) 100%);
  }

  .wordmark{
    position: fixed;
    top: 28px;
    left: 32px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.18em;
    font-weight: 600;
    user-select: none;
  }
  .wordmark .mark{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--teal), var(--blue));
    box-shadow: 0 0 12px 2px rgba(63,224,197,0.55);
  }

  main{
    position: relative;
    z-index: 4;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 0 24px;
  }

  .presence{
    width: 96px;
    height: 96px;
    margin-top: auto;
    margin-bottom: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.9), rgba(140,124,245,0.35) 40%, rgba(63,224,197,0.18) 70%, transparent 78%);
    box-shadow: 0 0 60px 10px rgba(74,143,224,0.18);
    animation: breathe 5.5s ease-in-out infinite;
    transition: transform 0.6s ease, margin 0.6s ease, width 0.6s ease, height 0.6s ease, opacity 0.6s ease;
    flex-shrink: 0;
  }
  .presence.compact{
    width: 40px;
    height: 40px;
    margin-top: 18px;
    margin-bottom: 18px;
  }
  .presence.awaiting{
    animation: breathe-fast 1.4s ease-in-out infinite;
  }

  @keyframes breathe{
    0%, 100%{ transform: scale(0.96); opacity: 0.85; }
    50%{ transform: scale(1.04); opacity: 1; }
  }
  @keyframes breathe-fast{
    0%, 100%{ transform: scale(0.92); opacity: 0.75; }
    50%{ transform: scale(1.08); opacity: 1; }
  }

  .intro{
    text-align: center;
    color: var(--muted);
    margin-bottom: 40px;
    transition: opacity 0.5s ease, height 0.5s ease, margin 0.5s ease;
  }
  .intro h1{
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  .intro p{
    margin: 0;
    font-size: 14px;
    color: var(--muted);
  }
  .intro.hidden{
    opacity: 0;
    height: 0;
    margin: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .thread{
    width: 100%;
    max-width: 620px;
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 22px;
    padding: 90px 4px 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--muted-2) transparent;
  }
  .thread::-webkit-scrollbar{ width: 6px; }
  .thread::-webkit-scrollbar-thumb{ background: var(--muted-2); border-radius: 3px; }

  .msg{
    max-width: 88%;
    line-height: 1.55;
    font-size: 15px;
    animation: rise 0.5s ease both;
  }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .msg.user{
    align-self: flex-end;
    color: var(--text);
    opacity: 0.92;
    text-align: right;
  }
  .msg.aurora{
    align-self: flex-start;
    color: var(--text);
    text-shadow: 0 0 18px rgba(63,224,197,0.15);
  }
  .msg.system{
    align-self: center;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    max-width: 100%;
  }

  form.composer{
    width: 100%;
    max-width: 620px;
    margin: 0 auto 32px;
    position: relative;
    z-index: 6;
  }

  .composer-inner{
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    backdrop-filter: blur(16px);
    border-radius: 999px;
    padding: 6px 6px 6px 20px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .composer-inner:focus-within{
    border-color: rgba(63,224,197,0.45);
    box-shadow: 0 0 0 1px rgba(63,224,197,0.12), 0 0 30px rgba(63,224,197,0.08);
  }

  textarea{
    flex: 1;
    resize: none;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.4;
    max-height: 120px;
    padding: 10px 0;
  }
  textarea::placeholder{ color: var(--muted-2); }

  button.send{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--teal), var(--blue));
    color: var(--void);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.15s ease;
  }
  button.send:disabled{
    opacity: 0.35;
    cursor: default;
  }
  button.send:not(:disabled):hover{ transform: scale(1.05); }
  button.send svg{ width: 16px; height: 16px; }

  @media (max-width: 520px){
    .presence{ width: 76px; height: 76px; }
    .wordmark{ top: 20px; left: 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    .aurora-field span, .presence, .msg{ animation: none !important; }
  }
</style>
</head>
<body>

  <canvas id="stars"></canvas>

  <div class="aurora-field" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="wordmark"><span class="mark"></span>AURORA</div>
  <button id="newchat" type="button" title="Start a new conversation">New chat</button>
  <style>
    #newchat{
      position: fixed;
      top: 28px;
      right: 32px;
      z-index: 5;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
    }
    #newchat:hover{ color: var(--text); border-color: rgba(63,224,197,0.45); }
  </style>

  <main>
    <div class="presence" id="presence"></div>

    <div class="intro" id="intro">
      <h1>Aurora</h1>
      <p>Say something to begin.</p>
    </div>

    <div class="thread" id="thread"></div>

    <form class="composer" id="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Message Aurora…" autofocus></textarea>
        <button class="send" id="send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </form>
  </main>

<script>
  // ---------- starfield ----------
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.floor((canvas.width * canvas.height) / 9000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.1 + 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 0.6
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  let t = 0;
  function drawStars(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for(const s of stars){
      const twinkle = reduceMotion ? 0.7 : 0.55 + 0.45 * Math.sin(t * 0.02 * s.speed + s.phase);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(234,243,246,${twinkle * 0.8})`;
      ctx.fill();
    }
    t++;
    requestAnimationFrame(drawStars);
  }
  drawStars();

  // ---------- chat ----------
  const thread = document.getElementById('thread');
  const intro = document.getElementById('intro');
  const presence = document.getElementById('presence');
  const composer = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  const conversation = [];
  let started = false;

  // ---------- session ----------
  // One browser conversation keeps one session_id so the server can tell
  // a continued chat apart from a brand-new one. Persisted locally only.
  function newSessionId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'sess-' + Date.now().toString(36) + '-'
      + Math.floor(Math.random() * 1e9).toString(36);
  }
  let sessionId = null;
  try{ sessionId = localStorage.getItem('primora_session_id'); }catch(e){}
  if(!sessionId){
    sessionId = newSessionId();
    try{ localStorage.setItem('primora_session_id', sessionId); }catch(e){}
  }
  const newChatBtn = document.getElementById('newchat');
  newChatBtn.addEventListener('click', () => {
    conversation.length = 0;
    thread.innerHTML = '';
    sessionId = newSessionId();
    try{ localStorage.setItem('primora_session_id', sessionId); }catch(e){}
    started = false;
    intro.classList.remove('hidden');
    presence.classList.remove('compact');
    input.focus();
  });

  function autoGrow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', autoGrow);

  function addMessage(role, text){
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
    return div;
  }

  function markStarted(){
    if(started) return;
    started = true;
    intro.classList.add('hidden');
    presence.classList.add('compact');
  }

  function setAwaiting(isAwaiting){
    presence.classList.toggle('awaiting', isAwaiting);
    input.disabled = isAwaiting;
    sendBtn.disabled = isAwaiting;
  }

  async function send(text){
    markStarted();
    addMessage('user', text);
    conversation.push({ role: 'user', content: text });

    setAwaiting(true);
    try{
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversation, session_id: sessionId })
      });

      let data;
      try{
        data = await res.json();
      }catch(e){
        addMessage('system', 'Aurora sent back something unreadable. Check the server logs.');
        return;
      }

      if(!res.ok || !data.success){
        const reason = (data && data.error) ? data.error : `request failed (${res.status})`;
        addMessage('system', `Aurora couldn't respond: ${reason}`);
        return;
      }

      if(data.session_id && data.session_id !== sessionId){
        sessionId = data.session_id;
        try{ localStorage.setItem('primora_session_id', sessionId); }catch(e){}
      }

      addMessage('aurora', data.content);
      conversation.push({ role: 'assistant', content: data.content });

    }catch(err){
      addMessage('system', `Couldn't reach Aurora: ${err.message}`);
    }finally{
      setAwaiting(false);
      input.focus();
    }
  }

  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if(!text || input.disabled) return;
    input.value = '';
    autoGrow();
    send(text);
  });

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      composer.requestSubmit();
    }
  });
</script>
</body>
</html>
